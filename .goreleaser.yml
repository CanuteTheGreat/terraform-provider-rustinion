# goreleaser config for the Terraform Registry release of this provider
# (see RELEASING.md). GitHub Actions in the public mirror runs it on every
# v* tag; the monorepo CI runs `goreleaser check` and a `--snapshot` build
# on every push.
#
# Shape matches HashiCorp's own documented goreleaser template for a
# terraform-plugin-framework provider (see
# https://developer.hashicorp.com/terraform/registry/providers/publishing),
# adjusted only where this provider's own layout requires it (module
# path/binary name match go.mod, not a generic placeholder).
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: ['zip']
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  # Requires GPG_FINGERPRINT (env) and a GPG key already imported into the
  # signing environment's keyring (GPG_PRIVATE_KEY/PASSPHRASE secrets of
  # the GitHub mirror, imported by .github/workflows/release.yml). `goreleaser
  # release --snapshot` (monorepo CI) skips this stage.
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
